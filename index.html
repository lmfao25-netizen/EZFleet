<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EZFleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2b2b2b;
    --surface:#333333;
    --surface-raised:#3c3c3c;
    --stroke:#4a4a4a;
    --text:#ececec;
    --text-muted:#9b9b9b;
    --accent:#29abe2;      /* ortec-style cyan blue */
    --accent-dim:#1c6f92;
    --accent-text:#ffffff;
    --steel:#29abe2;
    --danger:#e5484d;
    --success:#4cae6d;
    --radius:10px;
    --plate:#323232;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  input,select,textarea,button{font-family:inherit;}
  h1,h2,h3,.display{font-family:'Oswald',sans-serif; letter-spacing:.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;}

  /* ---------- Utility ---------- */
  .hidden{display:none !important;}
  .muted{color:var(--text-muted);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent);color:var(--accent-text);border:none;border-radius:var(--radius);
    padding:13px 18px;font-weight:600;font-size:15px;cursor:pointer;
    transition:filter .15s ease, transform .1s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.55;cursor:default;transform:none;}
  .btn:hover{filter:brightness(1.08);}
  .btn-secondary{background:var(--surface-raised);color:var(--text);border:1px solid var(--stroke);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-block{width:100%;}
  .btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--accent-dim);}
  .icon-btn{background:none;border:none;color:var(--text);cursor:pointer;padding:8px;display:flex;align-items:center;justify-content:center;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;background:var(--surface-raised);border:1px solid var(--stroke);color:var(--text);
    padding:12px 12px;border-radius:8px;font-size:15px;outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
  .row{display:flex;gap:12px;}
  .row > .field{flex:1;}
  .card{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--radius);padding:14px;}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin:22px 0 10px;font-weight:600;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);}
  .empty-state .glyph{font-size:34px;margin-bottom:10px;opacity:.6;}

  /* ---------- Screens ---------- */
  .screen{flex:1;display:flex;flex-direction:column;min-height:100vh;}
  .scroll{flex:1;overflow-y:auto;padding:16px 16px 100px;}

  /* Login */
  #screen-login{align-items:center;justify-content:center;padding:32px;position:relative;background:
    radial-gradient(circle at 50% 0%, #1e2530 0%, var(--bg) 60%);
  }
  .login-box{width:100%;max-width:340px;text-align:center;}
  .logo-slot{
    width:120px;height:120px;border-radius:16px;margin:0 auto 22px;
    background:var(--surface-raised);border:1.5px dashed var(--stroke);
    display:flex;align-items:center;justify-content:center;color:var(--text-muted);
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:10px;text-align:center;
    overflow:hidden;
  }
  .logo-slot img{width:100%;height:100%;object-fit:contain;}
  .login-title{font-size:26px;margin:0 0 4px;color:var(--text);}
  .login-sub{color:var(--text-muted);font-size:13px;margin-bottom:28px;}
  .login-error{color:var(--danger);font-size:13px;min-height:18px;margin-top:6px;}

  /* Top bar */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 8px 10px;position:sticky;top:0;background:var(--bg);z-index:20;
    border-bottom:1px solid var(--stroke);
  }
  .topbar .logo-mini{
    flex:1;display:flex;justify-content:center;align-items:center;height:34px;
  }
  .topbar .logo-mini img{max-height:34px;max-width:140px;object-fit:contain;}
  .topbar .logo-mini .placeholder-text{font-family:'Oswald';font-size:17px;letter-spacing:.05em;color:var(--accent);}
  .topbar .spacer{width:40px;}
  .lang-toggle{
    min-width:40px;height:34px;padding:0 10px;border-radius:999px;background:var(--surface-raised);
    border:1px solid var(--stroke);color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.03em;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .login-lang-toggle{position:absolute;top:18px;right:18px;}
  .lang-options{display:flex;gap:10px;}
  .lang-option{
    flex:1;padding:12px;border-radius:8px;border:1px solid var(--stroke);background:var(--surface-raised);
    color:var(--text);cursor:pointer;font-size:14px;font-weight:600;text-align:center;
  }
  .lang-option.active{border-color:var(--accent);color:var(--accent);background:rgba(41,171,226,.12);}
  .search-wrap{padding:10px 16px 14px;position:sticky;top:58px;background:var(--bg);z-index:19;}
  .search-suggestions{
    position:absolute;top:100%;left:16px;right:16px;margin-top:6px;
    background:var(--surface-raised);border:1px solid var(--stroke);border-radius:10px;
    box-shadow:0 10px 24px rgba(0,0,0,.45);max-height:280px;overflow-y:auto;z-index:25;
  }
  .suggestion-item{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--stroke);}
  .suggestion-item:last-child{border-bottom:none;}
  .suggestion-item:hover, .suggestion-item:active{background:var(--surface);}
  .suggestion-text{flex:1;min-width:0;}
  .suggestion-primary{font-family:'JetBrains Mono';font-weight:700;font-size:13px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .suggestion-sub{font-size:12px;color:var(--text-muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .search-bar{
    display:flex;align-items:center;gap:8px;background:var(--surface-raised);
    border:1px solid var(--stroke);border-radius:999px;padding:10px 14px;
  }
  .search-bar input{flex:1;background:none;border:none;color:var(--text);font-size:14px;outline:none;}
  .search-bar svg{flex-shrink:0;opacity:.6;}

  /* Hamburger / drawer */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:29;opacity:0;pointer-events:none;transition:opacity .2s;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;left:0;bottom:0;width:78%;max-width:300px;background:var(--surface);
    z-index:30;transform:translateX(-105%);transition:transform .22s ease;
    border-right:1px solid var(--stroke);display:flex;flex-direction:column;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:22px 18px 14px;border-bottom:1px solid var(--stroke);}
  .drawer-head .plate-badge{
    display:inline-block;background:var(--plate);border:1px solid var(--stroke);border-radius:6px;
    padding:6px 10px;font-family:'JetBrains Mono';font-size:11px;letter-spacing:.08em;color:var(--accent);
  }
  .drawer-nav{padding:8px;flex:1;overflow-y:auto;}
  .drawer-item{
    display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:8px;
    color:var(--text);cursor:pointer;font-size:15px;font-weight:500;
  }
  .drawer-item:hover, .drawer-item.active{background:var(--surface-raised);color:var(--accent);}
  .drawer-item .count{margin-left:auto;color:var(--text-muted);font-size:12px;background:var(--bg);padding:2px 8px;border-radius:999px;}
  .drawer-item .chevron{margin-left:auto;transition:transform .18s ease;color:var(--text-muted);}
  .drawer-item .chevron.open{transform:rotate(90deg);}
  .drawer-sub{overflow:hidden;max-height:0;transition:max-height .22s ease;}
  .drawer-sub.open{max-height:900px;}
  .drawer-sub-item{
    display:flex;align-items:center;gap:10px;padding:11px 12px 11px 34px;border-radius:8px;
    color:var(--text-muted);cursor:pointer;font-size:14px;font-weight:500;
  }
  .drawer-sub-item:hover, .drawer-sub-item.active{background:var(--surface-raised);color:var(--accent);}
  .drawer-sub-item .count{margin-left:auto;color:var(--text-muted);font-size:11px;background:var(--bg);padding:2px 7px;border-radius:999px;}
  .drawer-sub-add{
    display:flex;align-items:center;gap:10px;padding:11px 12px 11px 34px;
    color:var(--accent);cursor:pointer;font-size:13.5px;font-weight:600;
  }
  .drawer-foot{padding:14px 18px;border-top:1px solid var(--stroke);}

  .status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .status-dot.status-available{background:var(--success);box-shadow:0 0 0 2px rgba(76,174,109,.2);}
  .status-dot.status-unavailable{background:var(--danger);box-shadow:0 0 0 2px rgba(229,72,77,.2);}
  .status-dot.status-garage{background:#f2a93b;box-shadow:0 0 0 2px rgba(242,169,59,.2);}
  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text-muted);}

  /* Home */
  .hero-strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:4px;}
  .stat-chip{
    flex:0 0 auto;background:var(--surface);border:1px solid var(--stroke);border-radius:var(--radius);
    padding:12px 16px;min-width:96px;text-align:center;
  }
  .stat-chip .num{font-family:'Oswald';font-size:22px;color:var(--accent);}
  .stat-chip .lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}

  /* Vehicle plate card (signature element) */
  .plate-card{
    position:relative;background:linear-gradient(180deg, var(--plate), #23282e);
    border:1px solid var(--stroke);border-radius:8px;padding:14px 16px 14px 18px;margin-bottom:12px;
    display:flex;gap:12px;align-items:center;cursor:pointer;
  }
  .plate-card:active{transform:scale(.99);}
  .plate-card::before, .plate-card::after{
    content:"";position:absolute;width:6px;height:6px;border-radius:50%;
    background:#0e1114;box-shadow:inset 0 0 0 1px #3c4550;top:8px;
  }
  .plate-card::before{left:8px;}
  .plate-card::after{right:8px;}
  .plate-thumb{
    width:56px;height:56px;border-radius:6px;background:var(--surface-raised);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--text-muted);font-size:20px;
  }
  .plate-thumb img{width:100%;height:100%;object-fit:cover;}
  .plate-info{flex:1;min-width:0;}
  .plate-vin{font-family:'JetBrains Mono';font-size:11px;color:var(--accent);letter-spacing:.05em;}
  .plate-model{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .plate-model-row{display:flex;align-items:center;gap:6px;min-width:0;}
  .plate-model-row .plate-model{min-width:0;}
  .plate-meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .unit-badge{
    display:inline-block;background:var(--accent);color:var(--accent-text);font-weight:700;
    font-size:10.5px;letter-spacing:.04em;padding:2px 7px;border-radius:5px;margin-bottom:4px;
  }
  .detail-unit{
    display:inline-block;background:var(--accent);color:var(--accent-text);font-weight:700;
    font-size:11px;letter-spacing:.04em;padding:3px 9px;border-radius:5px;margin-bottom:6px;
  }
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;}
  .chip-row .tab-btn{background:var(--surface);}
  .plate-chevron{color:var(--text-muted);flex-shrink:0;}

  /* Detail screen */
  .detail-hero{
    background:var(--surface);border-bottom:1px solid var(--stroke);padding:18px 16px;
  }
  .detail-title{font-size:22px;margin:0 0 2px;}
  .detail-vin{font-family:'JetBrains Mono';color:var(--accent);font-size:13px;}
  .tab-strip{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--stroke);background:var(--bg);position:sticky;top:58px;z-index:15;}
  .tab-btn{
    flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--stroke);background:var(--surface);
    color:var(--text-muted);font-size:13px;font-weight:600;cursor:pointer;
  }
  .tab-btn.active{background:var(--accent);color:#1a1406;border-color:var(--accent);}

  .photo-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;padding:4px 0;}
  .photo-thumb{position:relative;width:100%;aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:var(--surface-raised);border:1px solid var(--stroke);cursor:pointer;}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb .del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);border:none;color:#fff;border-radius:50%;width:22px;height:22px;font-size:13px;line-height:1;cursor:pointer;z-index:2;}
  .photo-add{
    width:100%;aspect-ratio:1/1;border-radius:8px;border:1.5px dashed var(--stroke);
    display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:26px;cursor:pointer;background:var(--surface);
  }

  .lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:flex;flex-direction:column;}
  .lightbox-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;flex-shrink:0;}
  .lightbox-count{color:var(--text-muted);font-size:13px;}
  .lightbox-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:6px;}
  .lightbox-stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;touch-action:pan-y;}
  .lightbox-stage img{max-width:94%;max-height:94%;object-fit:contain;border-radius:6px;}
  .lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:none;color:#fff;width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .lightbox-nav.prev{left:10px;}
  .lightbox-nav.next{right:10px;}

  .list-row{
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    padding:12px 0;border-bottom:1px solid var(--stroke);
  }
  .list-row:last-child{border-bottom:none;}
  .list-row .title{font-weight:600;font-size:14.5px;}
  .list-row .sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
  .list-row .price{font-family:'JetBrains Mono';color:var(--accent);font-weight:600;white-space:nowrap;}
  .row-actions{display:flex;gap:4px;}

  .badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600;}
  .badge-ok{background:rgba(76,174,109,.15);color:var(--success);}
  .badge-due{background:rgba(242,169,59,.15);color:var(--accent);}
  .badge-overdue{background:rgba(229,72,77,.15);color:var(--danger);}

  .fab{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
    width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-text);
    border:none;font-size:26px;box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer;z-index:18;
    display:flex;align-items:center;justify-content:center;
  }

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center;}
  .modal{background:var(--surface);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:20px 18px 26px;max-height:88vh;overflow-y:auto;}
  .modal-handle{width:40px;height:4px;background:var(--stroke);border-radius:2px;margin:0 auto 16px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;}

  .back-row{display:flex;align-items:center;gap:6px;padding:14px 12px 0;}
  .back-row .lbl{font-size:14px;color:var(--text-muted);}

  /* Parts shop grid */
  .shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .shop-card{background:var(--surface);border:1px solid var(--stroke);border-radius:10px;overflow:hidden;cursor:pointer;}
  .shop-card:active{transform:scale(.98);}
  .shop-card-img{width:100%;aspect-ratio:1/1;background:var(--surface-raised);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .shop-card-img img{width:100%;height:100%;object-fit:cover;}
  .shop-card-noimg{font-size:30px;color:var(--text-muted);}
  .shop-card-body{padding:9px 10px 11px;}
  .shop-card-cat{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);}
  .shop-card-name{font-size:13px;font-weight:600;margin-top:2px;line-height:1.25;}
  .shop-card-price{font-family:'JetBrains Mono';color:var(--accent);font-weight:700;margin-top:6px;font-size:14px;}
  .part-photo-preview{position:relative;width:100%;height:140px;border-radius:8px;overflow:hidden;background:var(--surface-raised);border:1px solid var(--stroke);}
  .part-photo-preview img{width:100%;height:100%;object-fit:cover;}
  .part-photo-preview .del{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);border:none;color:#fff;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:13px;}

  /* Calendar */
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .cal-month-label{font-family:'Oswald';font-size:17px;letter-spacing:.03em;flex:1;text-align:center;}
  .cal-grid{display:grid;grid-template-columns:repeat(7, 1fr);gap:4px;}
  .cal-grid.cal-dow{margin-bottom:2px;}
  .cal-dow-cell{text-align:center;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;padding:4px 0;}
  .cal-cell{
    aspect-ratio:1/1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;background:var(--surface);border:1px solid transparent;gap:2px;
  }
  .cal-cell.cal-empty{background:none;cursor:default;}
  .cal-cell:not(.cal-empty):hover{border-color:var(--stroke);}
  .cal-daynum{font-size:13px;}
  .cal-cell.cal-today{border-color:var(--accent);}
  .cal-cell.cal-today .cal-daynum{color:var(--accent);font-weight:700;}
  .cal-cell.cal-selected{background:var(--accent);}
  .cal-cell.cal-selected .cal-daynum{color:var(--accent-text);font-weight:700;}
  .cal-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);}
  .cal-cell.cal-selected .cal-dot{background:var(--accent-text);}

  ::-webkit-scrollbar{display:none;}

  /* ---------- Toast Notifications ---------- */
  .toast-stack{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    width:100%;max-width:440px;padding:0 16px;
    display:flex;flex-direction:column-reverse;gap:10px;
    z-index:60;pointer-events:none;
  }
  .toast{
    pointer-events:auto;cursor:pointer;
    background:var(--surface-raised);border:1px solid var(--stroke);border-left:4px solid var(--accent);
    border-radius:10px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.45);
    display:flex;align-items:flex-start;gap:10px;
    animation:toastIn .28s ease;
  }
  .toast.leaving{animation:toastOut .22s ease forwards;}
  .toast.toast-overdue{border-left-color:var(--danger);}
  .toast.toast-due{border-left-color:#f2a93b;}
  .toast.toast-info{border-left-color:var(--success);}
  .toast .toast-icon{font-size:18px;flex-shrink:0;margin-top:1px;}
  .toast .toast-body{flex:1;min-width:0;}
  .toast .toast-title{font-size:13.5px;font-weight:600;color:var(--text);}
  .toast .toast-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .toast .toast-close{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:2px;flex-shrink:0;font-size:13px;}
  @keyframes toastIn{ from{opacity:0;transform:translateY(18px) scale(.97);} to{opacity:1;transform:translateY(0) scale(1);} }
  @keyframes toastOut{ from{opacity:1;transform:translateY(0);} to{opacity:0;transform:translateY(18px);} }
</style>
</head>
<body>
<div id="app">

  <!-- ================= LOGIN ================= -->
  <div class="screen" id="screen-login">
    <button class="lang-toggle login-lang-toggle" id="loginLangToggle" onclick="toggleLanguage()">EN</button>
    <div class="login-box">
      <div class="logo-slot" id="loginLogoSlot">COMPANY<br>LOGO</div>
      <h1 class="login-title">EZFleet</h1>

  const lang = (DB && DB.language) || 'en';
  let str = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;

    Object.keys(params).forEach(p=>{ str = str.replace(new RegExp('\\{'+p+'\\}','g'), params[p]); });

}

// Point this at your deployed ezfleet-server URL, e.g. 'https://ezfleet-api.onrender.com'.
// Leave as '' only if this page is served from the exact same origin as the API.
const API_BASE_URL = 'https://ezfleet.up.railway.app';

const TOKEN_KEY = 'ezfleet_token';
const CURRENT_USER_KEY = 'ezfleet_current_user';

function getToken(){ return localStorage.getItem(TOKEN_KEY); }
function setToken(token){ localStorage.setItem(TOKEN_KEY, token); }
function clearToken(){ localStorage.removeItem(TOKEN_KEY); }
function getCurrentUser(){
  try{ return JSON.parse(localStorage.getItem(CURRENT_USER_KEY) || 'null'); }catch(e){ return null; }
}
function setCurrentUser(user){ localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(user)); }

// Mirrors the server's access rules for UI purposes (hiding what a
// restricted user can't use anyway). The server enforces every one of these
// for real on every request — this just keeps the interface from showing
// dead ends and disabled-looking controls.
function accessScope(){
  const me = getCurrentUser();
  if(!me) return {restricted:false, locationId:null};
  const canAll = me.capabilities && me.capabilities.canViewAllLocations;
  const restricted = !canAll && !!me.locationId;
  return {restricted, locationId: restricted ? me.locationId : null};
}
// can('canManagePhotos'), can('canManageParts'), can('canEditVehicleInfo'),
// can('canManageMaintenance'), can('canCreateWorkOrders'), can('canManageReports'),
// can('canManageVehicles'), can('canMoveVehicleLocation'), can('canViewParts')
function can(capability){
  const me = getCurrentUser();
  return !!(me && me.capabilities && me.capabilities[capability]);
}

async function apiFetch(path, options){
  options = options || {};
  const headers = Object.assign({'Content-Type':'application/json'}, options.headers||{});
  const token = getToken();
  if(token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE_URL + path, Object.assign({}, options, {headers}));
  let data = null;
  try{ data = await res.json(); }catch(e){ /* no body */ }
  if(!res.ok){
    const err = new Error((data && data.error) || ('Request failed (' + res.status + ')'));
    err.status = res.status;
    throw err;
  }
  return data;
}

// Local cache only — the server (once logged in) is the real source of truth.
// This lets the app still show last-known data instantly and works offline;
// hydrateFromServer() overwrites it with live data right after login.
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(!parsed.locations || !parsed.locations.length) parsed.locations = DEFAULT_LOCATIONS.slice();
      if(!parsed.language) parsed.language = 'en';
      if(!parsed.subcategories) parsed.subcategories = JSON.parse(JSON.stringify(DEFAULT_SUBCATEGORIES));
      if(!parsed.partCategories) parsed.partCategories = DEFAULT_PART_CATEGORIES.slice();
      if(!parsed.events) parsed.events = [];
      if(!parsed.roles) parsed.roles = [];
      mergeDefaultSubcategories(parsed);
      return parsed;
    }
  }catch(e){ console.warn('DB load failed', e); }
  return {
    companyLogo:'https://ca.ortec-group.com/wp-content/uploads/2021/11/Logo-Ortec-Env-Services-CA-FR-Cyan-80.png',
    locations: DEFAULT_LOCATIONS.slice(),
    subcategories: JSON.parse(JSON.stringify(DEFAULT_SUBCATEGORIES)),
    partCategories: DEFAULT_PART_CATEGORIES.slice(),
    events: [],
    roles: [],
    vehicles:[],
    language: 'en',
  };
}

let _syncTimer = null;
function saveDB(){
  // Local cache write: instant, works offline.
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
  // Background sync to the server (debounced so rapid edits don't spam requests).
  if(!getToken()) return; // not logged in yet (e.g. still on the login screen)
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(syncStateToServer, 400);
}

async function syncStateToServer(){
  const vehiclesPayload = DB.vehicles.map(v=>{ const copy = Object.assign({}, v); delete copy.reports; return copy; });
  const calls = [
    apiFetch('/api/vehicles', {method:'PUT', body: JSON.stringify({vehicles: vehiclesPayload})}),
    apiFetch('/api/locations', {method:'PUT', body: JSON.stringify({locations: DB.locations})}),
    apiFetch('/api/subcategories', {method:'PUT', body: JSON.stringify({subcategories: DB.subcategories})}),
  ];
  if(can('canManageParts')){
    calls.push(apiFetch('/api/partCategories', {method:'PUT', body: JSON.stringify({partCategories: DB.partCategories})}));
  }
  const me = getCurrentUser();
  if(me && me.isAdmin){
    calls.push(apiFetch('/api/settings/logo', {method:'PUT', body: JSON.stringify({logo: DB.companyLogo || null})}));
  }
  try{ await Promise.all(calls); }
  catch(e){ console.warn('Sync to server failed (will retry on next change):', e.message); }
}

async function hydrateFromServer(){
  const state = await apiFetch('/api/state');
  DB.locations = state.locations && state.locations.length ? state.locations : DEFAULT_LOCATIONS.slice();
  DB.subcategories = state.subcategories || JSON.parse(JSON.stringify(DEFAULT_SUBCATEGORIES));
  mergeDefaultSubcategories(DB);
  DB.partCategories = state.partCategories && state.partCategories.length ? state.partCategories : DEFAULT_PART_CATEGORIES.slice();
  DB.vehicles = state.vehicles || [];
  DB.events = state.events || [];
  DB.roles = state.roles || [];
  if(state.companyLogo) DB.companyLogo = state.companyLogo;
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
}

let _authMode = 'login'; // 'login' | 'register'

function toggleAuthMode(){
  _authMode = _authMode === 'login' ? 'register' : 'login';
  renderAuthMode();
}
function renderAuthMode(){
  const isRegister = _authMode === 'register';
  $('loginNameField').classList.toggle('hidden', !isRegister);
  $('loginSubmitBtn').textContent = isRegister ? t('createAccountBtn') : t('signInBtn');
  $('authModeToggle').textContent = isRegister ? t('backToSignIn') : t('createAccountLink');
  $('loginError').textContent = '';
}

async function doLogin(){
  if(_authMode === 'register') return doRegister();
  const username = $('loginUser').value.trim();
  const password = $('loginPass').value;
  if(!username || !password){ $('loginError').textContent = t('incorrectLogin'); return; }
  $('loginSubmitBtn').disabled = true;
  try{
    const data = await apiFetch('/api/auth/login', {method:'POST', body: JSON.stringify({username, password})});
    setToken(data.token);
    setCurrentUser(data.user);
    $('loginError').textContent = '';
    await enterApp();
  }catch(e){
    $('loginError').textContent = e.message || t('incorrectLogin');
  }finally{
    $('loginSubmitBtn').disabled = false;
  }
}

async function doRegister(){
  const name = $('loginName').value.trim();
  const username = $('loginUser').value.trim();
  const password = $('loginPass').value;
  if(!name || !username || !password){ $('loginError').textContent = t('registerFieldsRequired'); return; }
  if(password.length < 6){ $('loginError').textContent = t('passwordTooShort'); return; }
  $('loginSubmitBtn').disabled = true;
  try{
    const data = await apiFetch('/api/auth/register', {method:'POST', body: JSON.stringify({name, username, password})});
    setToken(data.token);
    setCurrentUser(data.user);
    $('loginError').textContent = '';
    await enterApp();
  }catch(e){
    $('loginError').textContent = e.message || t('registerFailed');
  }finally{
    $('loginSubmitBtn').disabled = false;
  }
}

async function enterApp(){
  $('screen-login').classList.add('hidden');
  $('screen-main').classList.remove('hidden');
  applyLogoEverywhere();
  renderHome();
  try{
    await hydrateFromServer();
    if(state.view==='home') renderHome();
  }catch(e){
    console.warn('Could not load latest data from server, showing local cache:', e.message);
    showToast({ kind:'due', icon:'📡', title: t('offlineModeTitle'), subtitle: t('offlineModeSub') });
  }
  setTimeout(checkMaintenanceNotifications, 500);
  setTimeout(checkEventReminders, 900);
}

// Try to resume a previous session on page load (token still valid = skip login screen).
async function tryResumeSession(){
  const token = getToken();
  if(!token) return;
  try{
    const res = await apiFetch('/api/auth/me');
    setCurrentUser(res.user);
    await enterApp();
  }catch(e){
    clearToken(); // token expired/invalid — show the login screen
  }
}

let _pendingSubcatTarget = null;
function openAddSubcategoryModal(catId, context){
  openManageSubcategoriesModal(catId, context);
}
function openManageSubcategoriesModal(catId, context){
  _pendingSubcatTarget = {catId, context};
  const list = DB.subcategories[catId] || [];
  const rows = list.map(s=>`
    <div class="list-row">
      <div class="title">${esc(subcategoryDisplayLabel(catId, s.id, s.label))}</div>
      <button class="icon-btn" onclick="deleteSubcategory('${catId}','${s.id}','${context}')" aria-label="Delete">🗑️</button>
    </div>
  `).join('');
  showModal(`
    <h3 style="margin-top:0;">${t('manageSubcategoriesTitle')}</h3>
    <div class="card" style="margin-bottom:16px;">${rows || `<div class="empty-state" style="padding:16px;">${t('noSubcategoriesYet')}</div>`}</div>
    <div class="field"><label>${t('subcategoryNameLabel')}</label><input id="newSubcatName" placeholder="${t('subcategoryNamePlaceholder')}"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">${t('cancelBtn')}</button>
      <button class="btn" onclick="saveNewSubcategory()">${t('addSubcategoryBtn')}</button>
    </div>
  `);
}
function refreshSubcategoryContext(catId, context, selectedId){
  if(context==='addVehicle'){
    const wrap = $('newSubcategoryWrap');
    if(wrap) wrap.innerHTML = subcategoryFieldHtml(catId, selectedId||'', 'newSubcategory', '', 'addVehicle');
  } else if(context==='info'){
    const v = currentVehicle();
    if(v && selectedId!==undefined){ v.subcategory = selectedId; touchVehicle(v); }
    if(!$('screen-detail').classList.contains('hidden')) renderDetailTabContent();
  } else if(context==='filter'){
    if(selectedId!==undefined) state.subcategory = selectedId || null;
    if(state.view==='category' && state.category===catId) renderCategory(catId);
  }
}
function saveNewSubcategory(){
  const name = $('newSubcatName').value.trim();
  if(!name){ alert(t('subcategoryNameRequiredAlert')); return; }
  const {catId, context} = _pendingSubcatTarget;
  const id = name.toLowerCase().replace(/[^a-z0-9]+/g,'') || uid();
  DB.subcategories[catId] = DB.subcategories[catId] || [];
  if(DB.subcategories[catId].some(s=>s.id===id)){ alert(t('subcategoryExistsAlert')); return; }
  DB.subcategories[catId].push({id, label:name});
  DB.subcategories[catId].sort((a,b)=>a.label.localeCompare(b.label));
  saveDB();
  $('newSubcatName').value = '';
  refreshSubcategoryContext(catId, context, id);
  openManageSubcategoriesModal(catId, context);
}
function deleteSubcategory(catId, subId, context){
  showConfirmModal(t('deleteSubcategoryConfirm'), ()=>{
    DB.subcategories[catId] = (DB.subcategories[catId]||[]).filter(s=>s.id!==subId);
    DB.vehicles.forEach(v=>{ if(v.category===catId && v.subcategory===subId) v.subcategory=''; });
    saveDB();
    refreshSubcategoryContext(catId, context, '');
    openManageSubcategoriesModal(catId, context);
  }, t('deleteBtn'));
}

function renderSearchSuggestions(rawQuery){
  const box = $('searchSuggestions');
  const q = (rawQuery||'').trim().toLowerCase();
  if(!q){ hideSearchSuggestions(); return; }
  let matches = DB.vehicles.filter(v=>{
    return (v.unitNumber||'').toLowerCase().includes(q) ||
           (v.vin||'').toLowerCase().includes(q) ||
           (v.model||'').toLowerCase().includes(q) ||
           String(v.year||'').includes(q);
  });
  matches.sort((a,b)=>{
    const aUnit = (a.unitNumber||'').toLowerCase();
    const bUnit = (b.unitNumber||'').toLowerCase();
    const aStarts = aUnit.startsWith(q) ? 0 : 1;
    const bStarts = bUnit.startsWith(q) ? 0 : 1;
    if(aStarts !== bStarts) return aStarts - bStarts;
    return aUnit.localeCompare(bUnit);
  });
  matches = matches.slice(0, 6);
  if(!matches.length){ hideSearchSuggestions(); return; }
  box.innerHTML = matches.map(v=>{
    const primary = v.unitNumber ? `${t('unitBadgePrefix')} ${esc(v.unitNumber)}` : esc(v.vin || t('noVinShort'));
    const sub = `${esc(v.year||'')} ${esc(v.model||t('unnamedVehicle'))}`.trim();
    return `<div class="suggestion-item" onmousedown="selectSuggestion('${v.id}')">
      ${statusIndicatorHtml(v)}
      <div class="suggestion-text">
        <div class="suggestion-primary">${primary}</div>
        <div class="suggestion-sub">${sub}</div>
      </div>
    </div>`;
  }).join('');
  box.classList.remove('hidden');
}
function hideSearchSuggestions(){
  const box = $('searchSuggestions');
  if(box) box.classList.add('hidden');
}

  hideSearchSuggestions();
  $('searchInput').value = '';
  openVehicle(id);
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ezfleet-backup.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importBackup(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.vehicles) throw new Error('Invalid file');
      DB = parsed;
      if(!DB.locations || !DB.locations.length) DB.locations = DEFAULT_LOCATIONS.slice();
      if(!DB.language) DB.language = 'en';
      if(!DB.subcategories) DB.subcategories = JSON.parse(JSON.stringify(DEFAULT_SUBCATEGORIES));
      if(!DB.partCategories) DB.partCategories = DEFAULT_PART_CATEGORIES.slice();
      if(!DB.events) DB.events = [];
      if(!DB.roles) DB.roles = [];
      mergeDefaultSubcategories(DB);
      saveDB();
      applyStaticTranslations();
      renderOptions();
      alert(t('backupRestoredAlert'));
    }catch(err){ alert(t('invalidBackupAlert')); }
  };
  reader.readAsText(file);
}

/* =========================================================
   TOAST NOTIFICATIONS (bottom banners, auto-dismiss 5s)
   ========================================================= */
let _toastCounter = 0;
function showToast(opts){
  const kind = opts.kind || 'info';
  const icon = opts.icon || (kind==='overdue' ? '⚠️' : kind==='due' ? '🔧' : '✅');
  const id = 'toast_' + (++_toastCounter);
  const el = document.createElement('div');
  el.className = `toast toast-${kind}`;
  el.id = id;
  el.innerHTML = `
    <div class="toast-icon">${icon}</div>
    <div class="toast-body">
      <div class="toast-title">${esc(opts.title)}</div>
      ${opts.subtitle ? `<div class="toast-sub">${esc(opts.subtitle)}</div>` : ''}
    </div>
    <button class="toast-close" onclick="event.stopPropagation(); dismissToast('${id}')">✕</button>
  `;
  if(opts.onClick){
    el.addEventListener('click', ()=>{ opts.onClick(); dismissToast(id); });
  }
  $('toastStack').appendChild(el);
  const timer = setTimeout(()=> dismissToast(id), 5000);
  el._toastTimer = timer;
  return id;
}
function dismissToast(id){
  const el = $(id);
  if(!el || el.classList.contains('leaving')) return;
  if(el._toastTimer) clearTimeout(el._toastTimer);
  el.classList.add('leaving');
  setTimeout(()=>{ if(el && el.parentNode) el.parentNode.removeChild(el); }, 220);
}

// Tracks which schedule items have already produced a banner this session,
// so re-rendering the app doesn't spam the same reminder repeatedly.
const _notifiedKeys = new Set();

function checkMaintenanceNotifications(){
  const today = new Date().toISOString().slice(0,10);
  const candidates = [];
  DB.vehicles.forEach(v=>{
    (v.maintenanceSchedule||[]).forEach(m=>{
      if(!m.dueDate) return;
      const key = v.id + '_' + m.id;
      if(_notifiedKeys.has(key)) return;
      const isOverdue = m.dueDate < today;
      const days = (new Date(m.dueDate) - new Date(today)) / 86400000;
      const isDueSoon = !isOverdue && days <= 7;
      if(isOverdue || isDueSoon) candidates.push({v, m, key, isOverdue});
    });
  });
  candidates.sort((a,b)=>{
    if(a.isOverdue !== b.isOverdue) return a.isOverdue ? -1 : 1;
    return (a.m.dueDate||'').localeCompare(b.m.dueDate||'');
  });
  candidates.slice(0, 6).forEach((c, idx)=>{
    _notifiedKeys.add(c.key);
    setTimeout(()=>{
      const vehicleLabel = `${c.v.year||''} ${c.v.model||t('unnamedVehicle')}`.trim();
      showToast({
        kind: c.isOverdue ? 'overdue' : 'due',
        title: `${c.isOverdue ? t('toastOverduePrefix') : t('toastDuePrefix')} ${c.m.task}`,
        subtitle: `${vehicleLabel} — ${t('dueLabel',{date:c.m.dueDate})}`,
        onClick: ()=>{
          state.detailTab = 'maint';
          openVehicle(c.v.id);
        },
      });
    }, idx * 400);
  });
}

let _lightboxImages = [];

function openLightbox(images, startIndex){
  if(!images || !images.length) return;
  _lightboxImages = images;
  _lightboxIndex = startIndex || 0;
  renderLightbox();
}

function renderLightbox(){
  const n = _lightboxImages.length;
  const showNav = n > 1;
  $('lightboxRoot').innerHTML = `
    <div class="lightbox-overlay" onclick="if(event.target===this) closeLightbox()">
      <div class="lightbox-top">
        <span class="lightbox-count">${_lightboxIndex+1} / ${n}</span>
        <button class="lightbox-close" onclick="closeLightbox()">✕</button>
      </div>
      <div class="lightbox-stage">
        ${showNav ? `<button class="lightbox-nav prev" onclick="lightboxNav(-1)">‹</button>` : ''}
        <img src="${_lightboxImages[_lightboxIndex]}">
        ${showNav ? `<button class="lightbox-nav next" onclick="lightboxNav(1)">›</button>` : ''}
      </div>
    </div>
  `;
}
function lightboxNav(delta){
  const n = _lightboxImages.length;
  _lightboxIndex = (_lightboxIndex + delta + n) % n;
  renderLightbox();
}

  $('lightboxRoot').innerHTML = '';
  _lightboxImages = [];
}

  if(!$('lightboxRoot') || !$('lightboxRoot').innerHTML) return;
  if(e.key==='Escape') closeLightbox();
  if(e.key==='ArrowLeft') lightboxNav(-1);
  if(e.key==='ArrowRight') lightboxNav(1);
});

  const schedule = (v.maintenanceSchedule||[]).slice().sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));

async function submitMaintenanceReport(vehicleId, scheduleIdToRemove){
  const type = $('mrType').value;
  if(!type){ alert(t('maintenanceTypeRequiredAlert')); return; }
  const notes = $('mrNotes').value.trim();
  const btn = $('submitMaintReportBtn');
  if(btn) btn.disabled = true;
  try{
    const res = await apiFetch(`/api/vehicles/${vehicleId}/maintenance-logs`, {
      method:'POST', body: JSON.stringify({type, notes}),
    });
    const log = res.log;
    const v = findVehicleById(vehicleId);
    v.maintenanceLogs = v.maintenanceLogs || [];
    v.maintenanceLogs.push(log);
    if(scheduleIdToRemove){
      v.maintenanceSchedule = (v.maintenanceSchedule||[]).filter(m=>m.id!==scheduleIdToRemove);
      localStorage.setItem(DB_KEY, JSON.stringify(DB));
    }
    closeModal();
    refreshAfterWorkOrderChange();
    showToast({
      kind:'info', icon:'🔧',
      title: t('toastMaintenanceLoggedTitle'),
      subtitle: maintTypeLabel(type),
      onClick: ()=> openMaintenanceLogDetail(vehicleId, log.id),
    });
  }catch(e){
    alert(e.message || t('registerFailed'));
  }finally{
    if(btn) btn.disabled = false;
  }

// Re-renders whichever screen is currently visible after a report/work-order
// change, since these can now be viewed from three different places: a
// vehicle's own tab, or the global Reports/Work Orders screens.
function refreshAfterWorkOrderChange(){
  if(state.currentPermitId) return; // permit detail view already re-rendered itself by the caller
  if(!$('screen-detail').classList.contains('hidden')) renderDetailTabContent();
  else if(state.view==='reports') renderGlobalReports();
  else if(state.view==='workorders') renderGlobalWorkOrders();
  else if(state.view==='maintenancelogs') renderGlobalMaintenanceLogs();
  else if(state.view==='permits') renderGlobalPermits();
}

async function updateReportSeverity(vehicleId, id, value){
  const v = findVehicleById(vehicleId);
  const r = (v.reports||[]).find(x=>x.id===id);
  if(!r) return;
  const previous = r.severity;
  r.severity = value; // optimistic UI update
  refreshAfterWorkOrderChange();
  try{
    await apiFetch(`/api/reports/${id}`, {method:'PATCH', body: JSON.stringify({severity:value})});
  }catch(e){
    r.severity = previous; // roll back on failure
    refreshAfterWorkOrderChange();
    alert(e.message || t('registerFailed'));
  }
}
function deleteReport(vehicleId, id){
  const v = findVehicleById(vehicleId);
  showConfirmModal(t('deleteReportConfirm'), async ()=>{
    try{
      await apiFetch(`/api/reports/${id}`, {method:'DELETE'});

async function submitWorkOrder(vehicleId, reportId){
  const description = $('woDesc').value.trim();
  if(!description){ alert(t('workOrderDescRequiredAlert')); return; }
  const btn = $('submitWorkOrderBtn');
  if(btn) btn.disabled = true;
  try{
    const res = await apiFetch(`/api/vehicles/${vehicleId}/reports/${reportId}/work-orders`, {
      method:'POST', body: JSON.stringify({description}),
    });
    const wo = res.workOrder;
    const v = findVehicleById(vehicleId);
    v.workOrders = v.workOrders || [];
    v.workOrders.push(wo);
    const r = (v.reports||[]).find(x=>x.id===reportId);
    if(r){ r.resolved = true; r.workOrderId = wo.id; }
    closeModal();
    refreshAfterWorkOrderChange();
    showToast({
      kind:'info', icon:'✅',
      title: t('toastWorkOrderCreatedTitle'),
      subtitle: t('workOrderNumberPrefix',{n:wo.number}),
      onClick: ()=> openWorkOrderDetail(vehicleId, wo.id),
    });
  }catch(e){
    alert(e.message || t('registerFailed'));
  }finally{
    if(btn) btn.disabled = false;
  }
}

async function submitPermitRequest(vehicleId){
  const type = $('permType').value;

  if(!workDescription){ alert(t('workDescRequiredAlert')); return; }
  const data = {
    performedBy: $('permPerformedBy').value,
    employeeNames: $('permEmployees').value.trim(),
    workDate: $('permDate').value,
    startTime: $('permStart').value,
    endTime: $('permEnd').value,

  try{

  HOT_WORK_CHECKLIST.forEach(item=>{

    if(el) preventiveMeasures[item.id] = el.value;
  });
  const data = {
    preventiveMeasures,
    otherMeasures: $('apOtherMeasures').value.trim(),
    attestationName,
    detectorNumber: $('apDetector').value.trim(),
    bumpTestDone: $('apBumpTest').value === 'yes',
    initialReading: {
      o2: $('apO2').value.trim(), co: $('apCO').value.trim(),
      h2s: $('apH2S').value.trim(), lie: $('apLIE').value.trim(),
      readBy: $('apReadBy').value.trim(),
    },
  };
  const btn = $('submitApproveBtn');
  if(btn) btn.disabled = true;
  try{
    const res = await apiFetch(`/api/permits/${permitId}/approve`, {method:'PATCH', body: JSON.stringify({data})});
    const v = findVehicleById(vehicleId);
    const idx = (v.permits||[]).findIndex(x=>x.id===permitId);
    if(idx>=0) v.permits[idx] = res.permit;
    closeModal();
    if(state.currentPermitId===permitId) renderPermitDetailView();
    refreshAfterWorkOrderChange();
    showToast({ kind:'info', icon:'✅', title: t('toastPermitApprovedTitle') });
  }catch(e){
    alert(e.message || t('registerFailed'));
  }finally{
    if(btn) btn.disabled = false;
  }
}

  return out.sort((a,b)=>(b.requestedAt||0)-(a.requestedAt||0));
}

/* =========================================================
   CALENDAR & APPOINTMENTS
   ========================================================= */
const REMINDER_OPTIONS = [0, 1, 3, 7, 14, 30];
function reminderOptionLabel(days){
  if(days===0) return t('reminderSameDay');
  if(days===1) return t('reminderOneDay');
  return t('reminderNDays',{n:days});
}

function goToCalendar(){
  closeDrawer();
  state.view = 'calendar';
  state.calendarCursor = state.calendarCursor || new Date().toISOString().slice(0,7);
  $('screen-detail').classList.add('hidden');
  $('screen-main').classList.remove('hidden');
  $('searchInput').value=''; hideSearchSuggestions();
  renderCalendar();
}

function eventsOnDate(dateStr){
  return DB.events.filter(e=>e.date===dateStr);
}
function eventVehicleLabel(e){
  if(!e.vehicleId) return t('generalEventLabel');
  const v = DB.vehicles.find(x=>x.id===e.vehicleId);
  return v ? `${v.year||''} ${v.model||t('unnamedVehicle')}`.trim() : t('generalEventLabel');
}

function renderCalendar(){
  state.view = 'calendar';
  $('fabAdd').classList.add('hidden');
  const cursor = state.calendarCursor || new Date().toISOString().slice(0,7);
  const [y, m] = cursor.split('-').map(Number);
  const firstOfMonth = new Date(y, m-1, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);
  const monthLabel = firstOfMonth.toLocaleDateString(DB.language==='fr'?'fr-FR':'en-US', {month:'long', year:'numeric'});

  const dowLabels = DB.language==='fr'
    ? ['D','L','M','M','J','V','S']
    : ['S','M','T','W','T','F','S'];

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell cal-empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const count = eventsOnDate(dateStr).length;
    const isToday = dateStr===todayStr;
    const isSelected = state.calendarSelectedDate===dateStr;
    cells += `<div class="cal-cell ${isToday?'cal-today':''} ${isSelected?'cal-selected':''}" onclick="selectCalendarDate('${dateStr}')">
      <span class="cal-daynum">${d}</span>
      ${count ? `<span class="cal-dot"></span>` : ''}
    </div>`;
  }

  const selDate = state.calendarSelectedDate;
  const selEvents = selDate ? eventsOnDate(selDate) : [];
  const selEventsHtml = selEvents.length
    ? selEvents.map(e=>`
      <div class="list-row" style="cursor:pointer;" onclick="openEventDetail('${e.id}')">
        <div>
          <div class="title">${esc(e.title)}</div>
          <div class="sub">${e.time? esc(e.time)+' · ':''}${esc(eventVehicleLabel(e))}</div>
        </div>
      </div>
    `).join('')
    : `<div class="empty-state" style="padding:20px;">${t('noEventsThisDay')}</div>`;

  $('mainContent').innerHTML = `
    <div class="cal-header">
      <button class="icon-btn" onclick="shiftCalendarMonth(-1)">‹</button>
      <div class="cal-month-label">${esc(monthLabel)}</div>
      <button class="icon-btn" onclick="shiftCalendarMonth(1)">›</button>
    </div>
    <div class="cal-grid cal-dow">${dowLabels.map(d=>`<div class="cal-cell cal-dow-cell">${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="section-title">${selDate ? esc(selDate) : t('selectADay')}</div>
    <div class="card">${selDate ? selEventsHtml : `<div class="empty-state" style="padding:20px;">${t('selectADayHint')}</div>`}</div>
    <button class="btn btn-block" style="margin-top:16px;" onclick="openAddEventModal(null, '${selDate||todayStr}')">${t('addEventAction')}</button>
  `;
}
function shiftCalendarMonth(delta){
  const [y,m] = (state.calendarCursor||new Date().toISOString().slice(0,7)).split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  state.calendarCursor = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  renderCalendar();
}
function selectCalendarDate(dateStr){
  state.calendarSelectedDate = dateStr;
  renderCalendar();
}

function openAddEventModal(vehicleId, presetDate){
  const v = vehicleId ? DB.vehicles.find(x=>x.id===vehicleId) : null;
  showModal(`
    <h3 style="margin-top:0;">${t('addEventTitle')}</h3>
    <div class="field"><label>${t('eventTitleLabel')}</label><input id="evTitle" placeholder="${t('eventTitlePlaceholder')}"></div>
    <div class="row">
      <div class="field"><label>${t('dateLabel')}</label><input id="evDate" type="date" value="${presetDate||''}"></div>
      <div class="field"><label>${t('eventTimeLabel')}</label><input id="evTime" type="time"></div>
    </div>
    ${v ? `<input type="hidden" id="evVehicle" value="${v.id}"><div class="field"><label>${t('locationFieldLabel2')}</label><div class="card" style="padding:10px 12px;">${esc((v.year||'')+' '+(v.model||t('unnamedVehicle')))}</div></div>`
        : `<div class="field"><label>${t('eventUnitLabel')}</label>
            <select id="evVehicle">
              <option value="">${t('generalEventLabel')}</option>
              ${DB.vehicles.map(x=>`<option value="${x.id}">${esc((x.year||'')+' '+(x.model||t('unnamedVehicle')))}${x.unitNumber?' — '+esc(x.unitNumber):''}</option>`).join('')}
            </select>
          </div>`}
    <div class="field"><label>${t('reminderLabel')}</label>
      <select id="evReminder">
        ${REMINDER_OPTIONS.map(d=>`<option value="${d}" ${d===0?'selected':''}>${reminderOptionLabel(d)}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>${t('notesLabel')}</label><textarea id="evNotes" rows="2"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">${t('cancelBtn')}</button>
      <button class="btn" onclick="saveEvent()">${t('saveBtn')}</button>
    </div>
  `);
}
async function saveEvent(){
  const title = $('evTitle').value.trim();
  const date = $('evDate').value;
  if(!title){ alert(t('eventTitleRequiredAlert')); return; }
  if(!date){ alert(t('eventDateRequiredAlert')); return; }
  const vehicleEl = $('evVehicle');
  const payload = {
    title,
    date,
    time: $('evTime').value || '',
    vehicleId: vehicleEl ? (vehicleEl.value || null) : null,
    reminderDays: parseInt($('evReminder').value, 10) || 0,
    notes: $('evNotes').value.trim(),
  };
  try{
    const res = await apiFetch('/api/events', {method:'POST', body: JSON.stringify(payload)});
    DB.events.push(res.event);
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
    closeModal();
    showToast({ kind:'info', title: t('toastEventScheduledTitle'), subtitle: `${title} — ${date}` });
    if(state.view==='calendar'){ state.calendarSelectedDate = date; renderCalendar(); }
    else if(!$('screen-detail').classList.contains('hidden')) renderDetailTabContent();
  }catch(e){
    alert(e.message || t('registerFailed'));
  }
}
function openEventDetail(id){
  const e = DB.events.find(x=>x.id===id);
  if(!e) return;
  showModal(`
    <h3 style="margin-top:0;">${esc(e.title)}</h3>
    <div class="field"><label>${t('dateLabel')}</label><div class="card" style="padding:10px 12px;">${esc(e.date)}${e.time?' · '+esc(e.time):''}</div></div>
    <div class="field"><label>${t('eventUnitLabel')}</label><div class="card" style="padding:10px 12px;">${esc(eventVehicleLabel(e))}</div></div>
    <div class="field"><label>${t('reminderLabel')}</label><div class="card" style="padding:10px 12px;">${reminderOptionLabel(e.reminderDays||0)}</div></div>
    ${e.notes ? `<div class="field"><label>${t('notesLabel')}</label><div class="card" style="padding:10px 12px;white-space:pre-wrap;">${esc(e.notes)}</div></div>` : ''}
    <div class="modal-actions">
      <button class="btn btn-danger" onclick="deleteEvent('${e.id}')">${t('deleteBtn')}</button>
      <button class="btn" onclick="closeModal()">${t('closeBtn')}</button>
    </div>
  `);
}
function deleteEvent(id){
  showConfirmModal(t('deleteEventConfirm'), async ()=>{
    try{
      await apiFetch(`/api/events/${id}`, {method:'DELETE'});
      DB.events = DB.events.filter(e=>e.id!==id);
      localStorage.setItem(DB_KEY, JSON.stringify(DB));
      closeModal();
      if(state.view==='calendar') renderCalendar();
      else if(!$('screen-detail').classList.contains('hidden')) renderDetailTabContent();
    }catch(e){
      alert(e.message || t('registerFailed'));
    }
  }, t('deleteBtn'));
}

function tabAppointmentsHtml(v){
  const events = DB.events.filter(e=>e.vehicleId===v.id).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const todayStr = new Date().toISOString().slice(0,10);
  const rows = events.map(e=>{
    const past = e.date < todayStr;
    return `<div class="list-row" style="cursor:pointer;${past?'opacity:.55;':''}" onclick="openEventDetail('${e.id}')">
      <div>
        <div class="title">${esc(e.title)}</div>
        <div class="sub">${esc(e.date)}${e.time?' · '+esc(e.time):''}</div>
      </div>
    </div>`;
  }).join('');
  return `
    <div class="section-title" style="margin-top:0;">${t('appointmentsTitle')}</div>
    <div class="card">${rows || `<div class="empty-state" style="padding:20px;">${t('noAppointmentsYet')}</div>`}</div>
    <button class="btn btn-block" style="margin-top:16px;" onclick="openAddEventModal('${v.id}', '')">${t('addAppointmentAction')}</button>
  `;
}

function checkEventReminders(){
  const today = new Date().toISOString().slice(0,10);
  const candidates = [];
  DB.events.forEach(e=>{
    if(!e.date) return;
    const key = 'event_' + e.id;
    if(_notifiedKeys.has(key)) return;
    const days = (new Date(e.date) - new Date(today)) / 86400000;
    if(days >= 0 && days <= (e.reminderDays||0)) candidates.push({e, key, days});
  });
  candidates.sort((a,b)=> a.days - b.days);
  candidates.slice(0,6).forEach((c, idx)=>{
    _notifiedKeys.add(c.key);
    setTimeout(()=>{
      showToast({
        kind: c.days===0 ? 'overdue' : 'due',
        icon: '📅',
        title: `${t('toastEventReminderTitle')} ${c.e.title}`,
        subtitle: `${eventVehicleLabel(c.e)} — ${c.e.date}${c.e.time?' · '+c.e.time:''}`,
        onClick: ()=> openEventDetail(c.e.id),
      });
    }, idx * 400);
  });
}
